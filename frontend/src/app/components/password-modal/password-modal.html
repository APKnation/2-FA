@if (open()) {
  <div class="modal-overlay" (click)="close()" (document:keydown.escape)="close()">
    <div class="modal-panel" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 class="modal-title">Change password</h2>
          <p class="modal-subtitle">Use your current password to set a new one.</p>
        </div>
        <button type="button" class="modal-close" aria-label="Close" (click)="close()">×</button>
      </div>

      <div class="modal-body">
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          @if (error(); as message) {
            <div class="alert alert-error" role="alert">{{ message }}</div>
          }

          <div class="field">
            <label class="label" for="current-password">Current password</label>
            <input
              id="current-password"
              type="password"
              class="input"
              formControlName="currentPassword"
              autocomplete="current-password"
            />
          </div>

          <div class="field">
            <label class="label" for="new-password">New password</label>
            <input
              id="new-password"
              type="password"
              class="input"
              formControlName="newPassword"
              autocomplete="new-password"
            />
            <p class="field-hint">Use at least 8 characters.</p>
          </div>

          <div class="field">
            <label class="label" for="confirm-password">Confirm new password</label>
            <input
              id="confirm-password"
              type="password"
              class="input"
              formControlName="confirmPassword"
              autocomplete="new-password"
            />
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-outline" (click)="close()">Cancel</button>
            <button type="submit" class="btn btn-brand" [disabled]="busy()">
              @if (busy()) {
                <span class="spinner" aria-hidden="true"></span>
                <span>Saving…</span>
              } @else {
                <span>Update password</span>
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
