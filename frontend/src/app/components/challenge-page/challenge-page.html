
<div class="auth-layout">
  <div class="card auth-card">
    <div class="challenge-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5l8-3z"
          fill="currentColor"
        />
        <rect x="9.4" y="9.6" width="5.2" height="4.6" rx="1" fill="#ffffff" />
        <path
          d="M10.6 13.4v2.2a.9.9 0 001.8 0v-2.2"
          stroke="#ffffff"
          stroke-width="1.4"
          stroke-linecap="round"
        />
    </svg>
    </div>

    <h1 class="challenge-title">Two-step verification</h1>
    <p class="challenge-subtitle">
      @if (email) {
        Enter the code for <strong>{{ email }}</strong> to finish signing in.
      } @else {
        Enter the code to finish signing in.
      }
    </p>

    @if (emailSent) {
      <div class="alert alert-success" role="status">
        A verification code was sent to your registered email. Check your inbox.
      </div>
    }

    <form (ngSubmit)="submit()">
      @if (error(); as message) {
        <div class="alert alert-error" role="alert">{{ message }}</div>
      }

      <div class="field">
        <label class="label" for="code">
          {{ useBackup() ? 'Backup code' : 'Authentication code' }}
        </label>
        <input
          id="code"
          class="input code-input"
          inputmode="numeric"
          autocomplete="one-time-code"
          [placeholder]="useBackup() ? 'XXXX-XXXX-XXXX-XXXX' : '000000'"
          [value]="code"
          (input)="code = $any($event.target).value"
        />
      </div>

      <button type="button" class="link-btn" (click)="toggleMode()">
        {{ useBackup() ? 'Use authenticator code instead' : 'Use a backup code instead' }}
      </button>

      <button type="submit" class="btn btn-brand btn-block submit" [disabled]="busy() || !code.trim()">
        @if (busy()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Verifying…</span>
        } @else {
          <span>Verify</span>
        }
      </button>
    </form>

    <button type="button" class="btn btn-ghost btn-block cancel" (click)="cancel()">
      Back to sign in
    </button>
  </div>
</div>
