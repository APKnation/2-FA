
<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" routerLink="/dashboard" data-testid="brand">
        <span class="brand-mark"><app-logo [size]="26" /></span>
        <span class="brand-name">
          Secure<span class="brand-accent">Auth</span>
        </span>
      </a>

      <div class="header-actions">
        <span class="api-chip" title="API base URL">{{ auth.apiBase() }}</span>
        <button type="button" class="btn btn-ghost btn-sm" (click)="openApiSettings()">
          API
        </button>
        @if (auth.accessToken()) {
          <button type="button" class="btn btn-outline btn-sm" (click)="logout()">
            Sign out
          </button>
        }
      </div>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <app-toast-container />

  @if (apiOpen()) {
    <div
      class="modal-overlay"
      (click)="apiOpen.set(false)"
      (document:keydown.escape)="apiOpen.set(false)"
    >
      <div class="modal-panel" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <div>
            <h2 class="modal-title">API settings</h2>
            <p class="modal-subtitle">Base URL of the SecureAuth backend.</p>
          </div>
          <button
            type="button"
            class="modal-close"
            aria-label="Close"
            (click)="apiOpen.set(false)"
          >
            ×
          </button>
        </div>
        <div class="modal-body">
          <label class="label" for="api-base">Base URL</label>
          <input
            id="api-base"
            class="input"
            [value]="apiUrl()"
            (input)="apiUrl.set($any($event.target).value)"
            placeholder="http://localhost:8000/api/v1"
          />
          <p class="hint">
            Use <code>/api/v1</code> with the Angular dev-server proxy, or the full URL
            <code>http://localhost:8000/api/v1</code> to call the backend directly.
          </p>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" (click)="apiOpen.set(false)">
              Cancel
            </button>
            <button type="button" class="btn btn-brand" (click)="saveApiSettings()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  }
}
